name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published, released]
permissions:
  contents: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: '构建 Docker 镜像'
      run: |
        docker build -t simulator .
    - name: '导出并上传镜像工件'
      run: |
        docker save simulator | gzip > simulator-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: 'simulator-docker-image-${{ github.ref_name }}'
        path: 'simulator-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14
    - name: '上传镜像包到 Release'
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: 'simulator-image.tar.gz'
        fail_on_unmatched_files: false
